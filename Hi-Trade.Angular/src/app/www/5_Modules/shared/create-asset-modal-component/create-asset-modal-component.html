@if (isOpen()) {
<div class="ht-modal-overlay" (click)="closeModal()">
  <div class="ht-modal-dialog" (click)="$event.stopPropagation()" role="dialog" aria-modal="true" aria-labelledby="createAssetTitle">
    <div class="ht-modal-header">
      <div>
        <h2 id="createAssetTitle" class="ht-modal-title">Create New Catalog Instrument</h2>
        <p class="text-xs text-slate-400 mt-0.5">Register a security or tradable asset into the market registry</p>
      </div>
      <button
        type="button"
        class="ht-modal-close"
        (click)="closeModal()"
        [disabled]="isSubmitting()"
        aria-label="Close modal"
      >
        &times;
      </button>
    </div>

    <form class="ht-modal-body" (ngSubmit)="onSubmit()">
      <div class="ht-form-group">
        <label for="assetTicker" class="ht-label">Ticker Symbol</label>
        <input
          id="assetTicker"
          name="ticker"
          type="text"
          class="ht-input ht-tabular-num font-bold uppercase tracking-wider"
          placeholder="e.g. AAPL"
          maxlength="16"
          [ngModel]="ticker()"
          (ngModelChange)="onTickerInput($event)"
          [disabled]="isSubmitting()"
          required
          autocomplete="off"
        />
        <span class="ht-form-hint">Must match Finnhub quote symbol identifier.</span>
      </div>

      <div class="ht-form-group">
        <label for="assetName" class="ht-label">Full Instrument Name</label>
        <input
          id="assetName"
          name="name"
          type="text"
          class="ht-input"
          placeholder="e.g. Apple Inc."
          maxlength="100"
          [ngModel]="name()"
          (ngModelChange)="onNameInput($event)"
          [disabled]="isSubmitting()"
          required
          autocomplete="off"
        />
      </div>

      @if (validationError()) {
      <div class="ht-alert ht-alert-danger mt-3 mb-0" role="alert">
        <span>{{ validationError() }}</span>
      </div>
      }
    </form>

    <div class="ht-modal-footer">
      <button
        type="button"
        class="ht-btn ht-btn-secondary"
        (click)="closeModal()"
        [disabled]="isSubmitting()"
      >
        Cancel
      </button>
      <button 
        type="button" 
        class="ht-btn ht-btn-primary" 
        (click)="onSubmit()"
        [disabled]="isSubmitting()"
      >
        @if (isSubmitting()) {
        Registering Asset...
        } @else {
        Create Asset
        }
      </button>
    </div>
  </div>
</div>
}
