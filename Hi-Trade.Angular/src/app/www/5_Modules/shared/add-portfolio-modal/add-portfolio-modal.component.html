@if (isOpen()) {
  <div class="ht-modal-overlay" (click)="onCancel()">
    <div class="ht-modal-dialog" (click)="$event.stopPropagation()">
      <div class="ht-modal-header">
        <h2 class="ht-modal-title">Create New Portfolio</h2>
        <button type="button" class="ht-modal-close" (click)="onCancel()" aria-label="Close modal">×</button>
      </div>

      <div class="ht-modal-body">
        <div class="ht-form-group">
          <label for="portfolioName" class="ht-label">Portfolio Name</label>
          <input
            id="portfolioName"
            type="text"
            [(ngModel)]="portfolioName"
            (keyup.enter)="onSubmit()"
            placeholder="e.g. Growth Alpha Strategy"
            class="ht-input"
            autofocus
          />
          <span class="ht-form-hint">Choose a recognizable label to organize your investment strategy.</span>
        </div>
      </div>

      <div class="ht-modal-footer">
        <button type="button" class="ht-btn ht-btn-secondary" (click)="onCancel()">Cancel</button>
        <button 
          type="button" 
          class="ht-btn ht-btn-primary" 
          (click)="onSubmit()" 
          [disabled]="!portfolioName().trim()"
        >
          Create Portfolio
        </button>
      </div>
    </div>
  </div>
}
