@if (isOpen()) {
  <div class="ht-modal-overlay" (click)="closeModal()">
    <div class="ht-modal-dialog" (click)="$event.stopPropagation()">
      <div class="ht-modal-header">
        <div>
          <h2 class="ht-modal-title">Reset Account Password</h2>
          <p class="text-xs text-slate-400 mt-0.5">We will send instructions to verify identity and restore access</p>
        </div>
        <button type="button" class="ht-modal-close" (click)="closeModal()" aria-label="Close modal">×</button>
      </div>

      <div class="ht-modal-body">
        <p class="text-sm text-slate-300 leading-relaxed mb-4">
          Enter the email address registered with your Hi-Trade account. A secure reset link with encrypted token will be sent to your inbox.
        </p>

        @if (statusMessage()) {
          <div class="ht-alert mb-4" [ngClass]="isSuccess() ? 'ht-alert-success' : 'ht-alert-danger'">
            <span>{{ statusMessage() }}</span>
          </div>
        }

        <div class="ht-form-group">
          <label for="resetEmail" class="ht-label">Registered Email Address</label>
          <input
            id="resetEmail"
            type="email"
            [ngModel]="email()"
            (ngModelChange)="email.set($event)"
            (keyup.enter)="onSubmit()"
            placeholder="trader@domain.com"
            class="ht-input"
            autofocus
            autocomplete="email"
          />
        </div>
      </div>

      <div class="ht-modal-footer">
        <button type="button" class="ht-btn ht-btn-secondary" (click)="closeModal()">Cancel</button>
        <button
          type="button"
          class="ht-btn ht-btn-primary"
          (click)="onSubmit()"
          [disabled]="isLoading() || !email().trim()"
        >
          {{ isLoading() ? 'Sending...' : 'Send Recovery Email' }}
        </button>
      </div>
    </div>
  </div>
}
