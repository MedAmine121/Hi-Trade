@if (isOpen()) {
  <div class="modal-overlay" (click)="closeModal()">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <div class="header-title-wrap">
          <span class="header-icon">🔑</span>
          <h2>Reset Password</h2>
        </div>
        <button class="close-btn" (click)="closeModal()" aria-label="Close modal">×</button>
      </div>

      <div class="modal-body">
        <p class="description">
          Enter the email address associated with your Hi-Trade account and we'll send you instructions to reset your password.
        </p>

        @if (statusMessage()) {
          <div class="alert-box" [ngClass]="isSuccess() ? 'success' : 'error'">
            <span>{{ statusMessage() }}</span>
          </div>
        }

        <div class="form-group">
          <label for="resetEmail">Email Address</label>
          <input
            id="resetEmail"
            type="email"
            [ngModel]="email()"
            (ngModelChange)="email.set($event)"
            (keyup.enter)="onSubmit()"
            placeholder="your@email.com"
            class="input-field"
            autofocus
          />
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn-cancel" (click)="closeModal()">Cancel</button>
        <button
          class="btn-submit"
          (click)="onSubmit()"
          [disabled]="isLoading() || !email().trim()"
        >
          {{ isLoading() ? 'Sending...' : 'Send Reset Link' }}
        </button>
      </div>
    </div>
  </div>
}
