<app-nav-bar-component></app-nav-bar-component>

<div class="auth-page-container">
  <div class="auth-card ht-card">
    <div class="auth-header" (click)="redirectToLogin()" role="button" tabindex="0">
      <div class="auth-brand-mark">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M3 17L9 11L13 15L21 7" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M16 7H21V12" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1 class="auth-title">Create New Password</h1>
      <p class="auth-subtitle">Set a secure password for <strong class="text-white">{{ email }}</strong></p>
    </div>

    @if (errorMessage()) {
      <div class="ht-alert ht-alert-danger mb-4">
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="ht-form-group">
        <label for="newPassword" class="ht-label">New Password</label>
        <input
          type="password"
          id="newPassword"
          name="newPassword"
          class="ht-input"
          placeholder="At least 12 characters"
          [(ngModel)]="newPassword"
          required
          minlength="12"
          autocomplete="new-password"
        />
        <span class="ht-form-hint">Must be at least 12 characters long</span>
      </div>

      <div class="ht-form-group">
        <label for="confirmPassword" class="ht-label">Confirm New Password</label>
        <input
          type="password"
          id="confirmPassword"
          name="confirmPassword"
          class="ht-input"
          placeholder="Re-enter your password"
          [(ngModel)]="confirmPassword"
          required
          autocomplete="new-password"
        />
      </div>

      <button
        type="submit"
        class="ht-btn ht-btn-primary auth-submit-btn"
        [disabled]="isLoading() || !newPassword || newPassword.length < 12 || newPassword !== confirmPassword"
      >
        {{ isLoading() ? 'Resetting Password...' : 'Reset Password' }}
      </button>
    </form>

    <div class="auth-footer-text">
      Remember your password?
      <button type="button" class="auth-switch-link" (click)="redirectToLogin()">
        Back to Sign In
      </button>
    </div>
  </div>
</div>
