<app-nav-bar-component></app-nav-bar-component>
<div class="reset-container">
  <div class="reset-wrapper">
    <div class="logo-section" (click)="redirectToLogin()">
      <div class="logo-icon">📈</div>
      <span class="logo-text">Hi-Trade</span>
    </div>

    <div class="reset-form">
      <h1 class="reset-title">Create New Password</h1>
      <p class="reset-subtitle">Enter a new secure password for <strong>{{ email }}</strong></p>

      @if (errorMessage()) {
        <div class="alert-box error">
          <span>{{ errorMessage() }}</span>
        </div>
      }

      <form (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="newPassword" class="form-label">New Password</label>
          <input
            type="password"
            id="newPassword"
            name="newPassword"
            class="form-input"
            placeholder="At least 12 characters"
            [(ngModel)]="newPassword"
            required
            minlength="12"
          />
          <span class="hint-text">Must be at least 12 characters long</span>
        </div>

        <div class="form-group">
          <label for="confirmPassword" class="form-label">Confirm New Password</label>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            class="form-input"
            placeholder="Re-enter your password"
            [(ngModel)]="confirmPassword"
            required
          />
        </div>

        <button
          type="submit"
          class="btn-reset-submit"
          [disabled]="isLoading() || !newPassword || newPassword.length < 12 || newPassword !== confirmPassword"
        >
          {{ isLoading() ? 'Resetting Password...' : 'Reset Password' }}
        </button>
      </form>

      <p class="back-link">
        Remember your password? <a (click)="redirectToLogin()">Back to Sign In</a>
      </p>
    </div>
  </div>
</div>
