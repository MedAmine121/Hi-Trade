@if(isAuthenticated === 1){
    @defer (on immediate) {
        <app-user-index-component></app-user-index-component>
    }
}
@else if(isAuthenticated === 2){
    @defer (on immediate) {
        <app-admin-index-component></app-admin-index-component>
    }
}
@else {
    @defer (on immediate) {
        <app-landing-page></app-landing-page>
    }
}
